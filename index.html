<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Without this a phone lays the page out at 980px and scales the result
     down, which means the max-width: 780px rules in styles.css never match
     and the stacked mobile layout never runs. -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- The name alone competes with every other Dante Smith. The trade is the
     other way round for the tab, where only the first word or two survives the
     truncation, so the name leads and the qualifier follows it. -->
<title>Dante Smith — Modern AI Designer</title>
<meta name="description" content="Dante Smith is an 18-year-old designer in Utah working in typography and web UI/UX, pairing hand-drawn wireframes and his own art direction with AI. Selected posters, brand and product work.">
<!-- GitHub Pages answers on both the apex and ds-2-dev.github.io, so without
     this the same page is two documents as far as a crawler is concerned. -->
<link rel="canonical" href="https://dantesmith.studio/">

<!-- The Warhol the name is knocked out of, cropped to a circle. The touch icon
     ships square instead, since iOS ignores the alpha and masks the corners
     itself. -->
<link rel="icon" href="images/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">

<!-- Open Graph. Without it a pasted link is a bare blue URL everywhere it
     lands, which for a portfolio is the worst place to have no design.
     Absolute URLs are not optional here: every scraper fetches these out of
     the page's context and a relative path resolves against nothing.
     og-card.jpg is JPEG rather than webp on purpose — LinkedIn's crawler is
     unreliable on webp and falls back to no image at all. JPEG rather than PNG
     because the card is a photograph of four printed pieces on black: PNG spent
     204 KB losslessly encoding sensor grain, and q92 holds the wordmark's edges
     at a third of that. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://dantesmith.studio/">
<meta property="og:site_name" content="Dante Smith">
<meta property="og:title" content="Dante Smith — Modern AI Designer">
<meta property="og:description" content="18yo designer in Utah. Typography, web UI/UX, and posters — leveraging the future, without losing taste.">
<meta property="og:image" content="https://dantesmith.studio/images/og-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Dante Smith, Modern AI Designer, over a cluster of poster and brand work.">
<meta property="og:locale" content="en_US">

<!-- LinkedIn reads the Open Graph tags above and ignores these; they are here
     for X, which reads its own. Four lines to cover a second network. -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Dante Smith — Modern AI Designer">
<meta name="twitter:description" content="18yo designer in Utah. Typography, web UI/UX, and posters — leveraging the future, without losing taste.">
<meta name="twitter:image" content="https://dantesmith.studio/images/og-card.jpg">

<!-- Ties the site to the LinkedIn profile as one identity rather than two
     unrelated pages that happen to share a name. sameAs is the property that
     does that work. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Dante Smith",
  "url": "https://dantesmith.studio/",
  "image": "https://dantesmith.studio/images/og-card.jpg",
  "jobTitle": "Designer",
  "description": "Modern AI Designer working in typography and web UI/UX.",
  "email": "mailto:dantesmith@weber.edu",
  "address": {
    "@type": "PostalAddress",
    "addressRegion": "UT",
    "addressCountry": "US"
  },
  "alumniOf": {
    "@type": "CollegeOrUniversity",
    "name": "Weber State University"
  },
  "knowsAbout": ["Typography", "UI/UX Design", "Brand Design", "Generative AI"],
  "sameAs": ["https://www.linkedin.com/in/dante-smith-/"]
}
</script>
<!-- Every preconnect ahead of every stylesheet: each of these sheets is
     render-blocking and pulls its font files from the same origin it came
     from, so the handshake is worth opening before the sheet is parsed
     rather than after. Typekit carries four faces here — argent-pixel-cf,
     fuuld, magistral, t26-carbon — not just the one label. -->
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/yrs7pes.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Michroma&family=Syne+Mono&display=swap">

<style>
  /* The blank canvas. Everything that was here is still in the repo — the
     stylesheet, the script, the images, the tests — this page simply does not
     pull any of it in. Build forward from here; `git checkout makeover --
     index.html` brings the grid back. */
  html { background: #ffffff; }
  body { margin: 0; min-height: 100svh; background: #ffffff; }
</style>
</head>
<body>
</body>
</html>
